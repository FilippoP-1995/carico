<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<title>Carico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app a una colonna, header sticky, contenuto a schede, barra di navigazione fissa in basso. Colori presi dai dischi olimpici: blu 20 kg per l'allenamento, giallo 15 kg per la dieta. */
:root{
  --bg:#eceff4; --surface:#ffffff; --surface-2:#f5f7fa; --ink:#121722; --muted:#5b6475; --line:#d6dbe4;
  --accent:#1e4fd0; --accent-soft:#e3eaff; --on-accent:#ffffff;
  --diet:#a46f00; --diet-soft:#fff3d6; --ok:#17844d; --ok-soft:#dff4e8; --danger:#c3312a; --danger-soft:#fde5e3;
  --shadow:0 1px 2px rgba(18,23,34,.06),0 4px 14px rgba(18,23,34,.05);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  --mm-b:#dfe3ec; --mm-n:#c9cfdb;
  --hero-bg:#141a2b; --hero-bg2:#1e2a52; --hero-ink:#f3f5fa; --hero-mut:#a9b2c7; --hero-track:rgba(255,255,255,.12); --hero-a:#7d9cff; --hero-d:#f2bf45; --hero-g:#4fd296;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1016; --surface:#161a23; --surface-2:#1c212c; --ink:#e8ebf2; --muted:#97a0b2; --line:#2a303d;
  --accent:#6189ff; --accent-soft:#1c2747; --on-accent:#0b0f18;
  --diet:#e8b236; --diet-soft:#3a2e10; --ok:#43c584; --ok-soft:#15301f; --danger:#ff6e63; --danger-soft:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4); --mm-b:#2a3142; --mm-n:#3a4255; --hero-bg:#18213a; --hero-bg2:#24346a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0d1016; --surface:#161a23; --surface-2:#1c212c; --ink:#e8ebf2; --muted:#97a0b2; --line:#2a303d;
  --accent:#6189ff; --accent-soft:#1c2747; --on-accent:#0b0f18;
  --diet:#e8b236; --diet-soft:#3a2e10; --ok:#43c584; --ok-soft:#15301f; --danger:#ff6e63; --danger-soft:#3b1a18;
  --shadow:0 1px 2px rgba(0,0,0,.4); --mm-b:#2a3142; --mm-n:#3a4255; --hero-bg:#18213a; --hero-bg2:#24346a; color-scheme:dark;}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(120px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--accent)}
.date{font-size:13px;color:var(--muted);text-transform:capitalize}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 8px;white-space:nowrap}
h2{font-family:var(--f-display);font-weight:700;font-size:26px;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 10px;line-height:1.05;text-wrap:balance}
h3{font-size:17px;font-weight:700;margin:0;line-height:1.25}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.btn{border-radius:12px;padding:12px 16px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.diet{background:var(--diet);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip.sm{padding:6px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.dietc[aria-pressed="true"]{background:var(--diet);border-color:var(--diet);color:var(--bg)}
.chip.add{border-style:dashed;color:var(--diet);border-color:var(--diet);background:transparent}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.bar.d>i{background:var(--diet)}
.bar>i.good{background:var(--ok)}
.bar>i.over{background:var(--danger)}
/* Allenamento */
.ex{padding:0;overflow:hidden}
.ex-h{padding:14px 16px 10px;display:flex;flex-direction:column;gap:4px}
.ex-t{display:flex;gap:8px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.ex-t b{color:var(--ink);font-weight:600}
.ex-n{font-size:13.5px;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:4px;color:var(--ink)}
.last{font-size:12.5px;color:var(--accent);font-weight:600}
.sets{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.set{display:grid;grid-template-columns:30px 1fr 18px 1fr 52px;align-items:center;gap:8px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .sn{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px;font-size:17px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums}
.set .x{text-align:center;color:var(--muted)}
.set .unit{font-size:11px;color:var(--muted);display:block;text-align:center;margin-top:2px}
.chk{width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.chk svg{width:22px;height:22px;stroke:var(--muted)}
.set.done{background:var(--ok-soft)}
.set.done .chk{background:var(--ok);border-color:var(--ok)}
.set.done .chk svg{stroke:#fff}
.set.done .sn{color:var(--ok)}
.exbtn{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;padding:14px 16px 12px;color:inherit}
.ex-top{display:flex;align-items:center;gap:10px}
.h3{font-size:17px;font-weight:700;line-height:1.25;flex:1;min-width:0}
.prog{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ex.complete .prog{color:var(--ok)}
.chev{width:20px;height:20px;stroke:var(--muted);flex:none;transition:transform .2s}
.open>.exbtn .chev,.meal.open .mhead .chev{transform:rotate(180deg)}
.ex-b{padding:0 16px 12px;display:flex;flex-direction:column;gap:6px}
.mhead{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:inherit}
.mhl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.sug{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sug p{padding:10px 12px}
.sg{display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:10px 12px;color:inherit}
.sg:first-child{border-top:0}
.sg:active{background:var(--surface-2)}
.sgn{font-weight:600;font-size:15px}
.sgd{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sg.ai .sgn{color:var(--diet)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.opt.sel{border-color:var(--diet);box-shadow:0 0 0 1px var(--diet);background:var(--diet-soft)}
.opth{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;padding:0;text-align:left;color:inherit}
.radio{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.opt.sel .radio{border-color:var(--diet);box-shadow:inset 0 0 0 4px var(--surface);background:var(--diet)}
.optl{font-weight:700;font-size:15.5px}
.optk{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.35}
.optk b{color:var(--ink);font-size:14px}
.add-alt{color:var(--diet);border:1px dashed var(--diet)}
.hero-sum{border-radius:20px;padding:18px 16px 14px;color:var(--hero-ink);background:radial-gradient(120% 90% at 100% 0%,var(--hero-bg2) 0%,var(--hero-bg) 62%);display:flex;flex-direction:column;gap:16px;box-shadow:0 10px 30px rgba(20,26,43,.25);overflow:hidden}
.hs-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hs-hi{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,7.4vw,30px);text-transform:uppercase;line-height:1;letter-spacing:.02em}
.hs-date{font-size:13px;color:var(--hero-mut);margin-top:4px}
.streak{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 10px}
.streak svg{width:20px;height:20px;fill:var(--hero-d)}
.streak b{font-family:var(--f-display);font-size:26px;line-height:1}
.streak span{font-size:10.5px;line-height:1.15;color:var(--hero-mut);text-transform:uppercase;letter-spacing:.05em}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ring{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px}
.rw{position:relative;width:min(88px,100%);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block}
.ring circle{transition:stroke-dasharray .6s ease}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;font-variant-numeric:tabular-nums}
.ring .rl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--hero-mut)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;font-size:11px;color:var(--hero-mut);font-weight:600}
.wd.today{background:rgba(255,255,255,.1);color:var(--hero-ink)}
.wd.sel{outline:2px solid var(--hero-a);outline-offset:-2px;color:var(--hero-ink)}
.wd.future{opacity:.45}
.wd i{display:block;width:18px;height:4px;border-radius:2px;background:var(--hero-track)}
.wd i.w{background:var(--hero-a)} .wd i.m{background:var(--hero-d)}
.hs-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.1);border-radius:14px;overflow:hidden}
.hs{background:var(--hero-bg);padding:10px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.hv{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.hv small{font-size:13px;color:var(--hero-mut);font-weight:600;margin-left:1px}
.hl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--hero-mut)}
.hsub{font-size:12px;color:var(--hero-ink);opacity:.8}
.insight{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.insight svg{flex:none;width:18px;height:18px;fill:var(--hero-d);margin-top:1px}
.insight b{color:#fff}
.quote{font-size:14.5px;line-height:1.4;padding:2px 2px 0;display:flex;flex-direction:column;gap:3px}
.quote .qk{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--hero-mut)}
.badges{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:-4px}
.badge-main{display:inline-flex;align-items:center;gap:8px;font-size:17px;font-weight:700;padding:8px 16px 8px 8px;border-radius:99px;background:linear-gradient(135deg,rgba(242,191,69,.22),rgba(125,156,255,.18));border:1px solid rgba(242,191,69,.45);box-shadow:0 6px 20px rgba(242,191,69,.15);animation:pop .5s cubic-bezier(.2,.9,.3,1.4)}
.badge-main .be{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);font-size:20px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.badge-h{font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:99px;padding:5px 10px;white-space:nowrap}
.fab{position:fixed;z-index:25;-webkit-touch-callout:none;width:58px;height:58px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:radial-gradient(120% 120% at 30% 20%,#3d63e0 0%,#1e2a52 70%);box-shadow:0 8px 24px rgba(20,26,43,.35),0 0 0 3px rgba(255,255,255,.6);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.fab svg{width:27px;height:27px;fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.fab.drag{transform:scale(1.08);transition:none}
.fab::after{content:"";position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--hero-g);border:2px solid #1e2a52}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.sh-head{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.sh-head .t{flex:1;min-width:0}
.sh-head .t b{font-family:var(--f-display);font-size:24px;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1}
.sh-head .t span{font-size:12.5px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.45;word-wrap:break-word}
.bub.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px;white-space:pre-wrap}
.bub.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.bub.a p{margin:0 0 6px} .bub.a p:last-child{margin:0}
.bub.a ul{margin:4px 0 6px;padding-left:18px} .bub.a li{margin:2px 0}
.bub.err{border-color:var(--danger);color:var(--danger)}
.coach-hi{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.coach-hi p{margin:0;font-size:15px;line-height:1.45}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchip{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 12px;font-size:14px;font-weight:600;text-align:left;color:inherit}
.composer{display:flex;gap:8px;align-items:flex-end;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.composer textarea{flex:1;min-height:46px;max-height:140px;resize:none;border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:11px 12px;font-size:16px;line-height:1.35;color:var(--ink)}
.composer .send{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex:none}
.composer .send svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1s infinite ease-in-out}
.typing i:nth-child(2){animation-delay:.15s} .typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.tools{display:flex;gap:6px}
.tool{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--diet);color:var(--diet);background:transparent;border-radius:10px;padding:8px 6px;font-size:13px;font-weight:600;white-space:nowrap}
.tool svg{width:18px;height:18px;stroke:currentColor;flex:none}
.tool span{overflow:hidden;text-overflow:ellipsis}
.rv-row{display:grid;grid-template-columns:minmax(0,1fr) 62px auto 28px;gap:6px;align-items:center}
.rv-n{display:flex;flex-direction:column;min-width:0}
.rv-n>span:first-child{font-weight:600;font-size:14.5px}
.rv-row .in{padding:8px;text-align:center;font-weight:700}
.shop-cta{border-color:var(--diet);color:var(--diet);font-weight:700}
.mmw{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px;align-items:center}
.mm{width:100%;height:auto;display:block}
.mm .mm-n{fill:var(--mm-n)} .mm .mm-b{fill:var(--mm-b)} .mm .mm-p{fill:var(--accent)} .mm .mm-s{fill:var(--accent);fill-opacity:.38}
.mm text{font-size:9px;fill:var(--muted);font-family:var(--f-body);text-transform:uppercase;letter-spacing:.06em}
.mm.dark .mm-n{fill:rgba(255,255,255,.16)} .mm.dark .mm-b{fill:rgba(255,255,255,.1)} .mm.dark .mm-p{fill:var(--hero-a)} .mm.dark .mm-s{fill:var(--hero-a);fill-opacity:.42} .mm.dark text{fill:var(--hero-mut)}
.mml{display:flex;flex-direction:column;gap:2px;font-size:13.5px;min-width:0}
.mmk{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.mmw.dark .mmk{color:var(--hero-mut)}

<script>
(() => {
"use strict";
/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const pad = n => String(n).padStart(2, "0");
const dstr = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => dstr(new Date());
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmtDay = (s, opt = {weekday:"long", day:"numeric", month:"long"}) => parseD(s).toLocaleDateString("it-IT", opt);
const norm = s => String(s || "").toLowerCase().replace(/\s+/g, " ").trim();
const num = v => { if (v == null || v === "") return null; const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; };
const fmtN = n => n == null ? "" : (Math.round(n * 10) / 10).toString().replace(".", ",");
const fmtI = n => Math.round(n || 0).toLocaleString("it-IT");
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ICON_X = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v13M6 12l6 6 6-6"/></svg>';
const APP_VERSION = "2.3 · 20 ottobre";
const IN_CLAUDE = !!(window.claude && window.claude.use);

let toastT;
function toast(msg, ms = 2800) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ---------- stato ---------- */
const EMPTY_PROFILE = () => ({ plan: { workout: { days: [] }, diet: { variants: [], targets: {}, notes: "" } }, weights: [] });
const S = {
  profile: EMPTY_PROFILE(), days: {}, tab: "oggi", date: today(),
  selDay: null, selVariant: null, progEx: null, confirmReset: false,
  importBusy: false, importMsg: null, importErr: false, pending: null, ctl: null,
  busy: {}, drafts: {}, altOpen: null, dataMsg: null,
  openEx: new Set(), openMeals: new Set(), exInit: null, mealInit: null, sug: {}, picker: null, labelKey: null,
};

/* ---------- archiviazione: account Claude (db) oppure questo dispositivo ---------- */
const store = {
  mode: "local", db: null, uid: null, profRef: null,
  async init() {
    try {
      if (IN_CLAUDE) {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const id = user ? await user.id() : null;
        let canWrite = null;
        try { canWrite = user && user.can ? await user.can("data.write") : null; } catch (e) {}
        if (db && id && canWrite !== false) {
          this.db = db; this.uid = id;
          this.profRef = db.doc("data/users/" + id + "/profile");
          const snap = await this.profRef.get();
          const daysSnap = await this.profRef.collection("days").orderBy("date", "desc").limit(400).get();
          this.mode = "cloud";
          const local = this.readLocal();
          if (snap.exists) S.profile = Object.assign(EMPTY_PROFILE(), snap.data());
          else if (local.profile) S.profile = Object.assign(EMPTY_PROFILE(), local.profile);
          daysSnap.docs.forEach(d => { if (d.exists) S.days[d.id] = JSON.parse(JSON.stringify(d.data())); });
          return;
        }
      }
    } catch (e) { console.warn("db non disponibile", e); }
    this.mode = "local";
    const l = this.readLocal();
    if (l.profile) S.profile = Object.assign(EMPTY_PROFILE(), l.profile);
    S.days = l.days || {};
    try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  },
  readLocal() {
    try { return { profile: JSON.parse(lsGet("carico.profile") || "null"), days: JSON.parse(lsGet("carico.days") || "{}") }; }
    catch (e) { return {}; }
  },
  writeLocal() { lsSet("carico.profile", JSON.stringify(S.profile)); lsSet("carico.days", JSON.stringify(S.days)); },
  chains: {}, timers: {},
  queue(key, fn) { // una scrittura alla volta per documento, raggruppando gli input ravvicinati
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => {
      this.chains[key] = (this.chains[key] || Promise.resolve()).then(fn).catch(e => this.fail(e));
    }, 450);
  },
  fail(e) {
    console.warn("salvataggio", e);
    if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) {
      if (this.mode === "cloud") { this.mode = "local"; this.writeLocal(); showMode(); toast("Salvo su questo dispositivo"); }
    } else if (e && e.code === "quota_exceeded") toast("Spazio esaurito: elimina dati vecchi");
  },
  saveProfile() {
    S.profile.updated = Date.now();
    this.writeLocal();
    if (this.mode === "cloud") this.queue("profile", () => this.profRef.set(JSON.parse(JSON.stringify(S.profile))));
  },
  saveDay(date) {
    this.writeLocal();
    if (this.mode === "cloud") this.queue("day:" + date, () => this.profRef.collection("days").doc(date).set(JSON.parse(JSON.stringify(S.days[date]))));
  },
  async replaceAll(profile, days) {
    const oldDays = Object.keys(S.days);
    S.profile = Object.assign(EMPTY_PROFILE(), profile); S.days = days || {};
    this.writeLocal();
    if (this.mode === "cloud") {
      try {
        await this.profRef.set(JSON.parse(JSON.stringify(S.profile)));
        for (const d of oldDays) if (!S.days[d]) await this.profRef.collection("days").doc(d).delete();
        for (const d of Object.keys(S.days)) await this.profRef.collection("days").doc(d).set(JSON.parse(JSON.stringify(S.days[d])));
      } catch (e) { this.fail(e); }
    }
  },
  async deleteAll() {
    if (this.mode === "cloud") {
      try {
        for (const d of Object.keys(S.days)) await this.profRef.collection("days").doc(d).delete();
        await this.profRef.delete();
      } catch (e) { this.fail(e); }
    }
    S.profile = EMPTY_PROFILE(); S.days = {};
    lsSet("carico.profile", null); lsSet("carico.days", null);
  }
};
function showMode() {
  const b = $("#saveMode"); b.hidden = false;
  b.textContent = store.mode === "cloud" ? "Salvato nel tuo account" : "Salvato su questo dispositivo";
}

/* ---------- AI: account Claude dentro Claude, chiave API fuori ---------- */
const AI = {
  sample: null, limits: null,
  key() { return lsGet("carico.apikey") || ""; },
  ready() { return !!(this.sample || this.key()); },
  canImages() { return this.sample ? !!(this.limits && this.limits.images) : !!this.key(); },
  maxImages() { return this.sample ? ((this.limits && this.limits.images && this.limits.images.maxCount) || 5) : 8; },
  async json(prompt, { images = [], tier = "default", signal, maxTokens = 8000 } = {}) {
    if (this.sample) {
      const o = { modelTier: tier }; if (signal) o.signal = signal; if (images.length) o.images = images;
      return this.sample.json(prompt, o);
    }
    const key = this.key(); if (!key) throw { code: "no_ai" };
    const content = [];
    for (const b of images) content.push({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: await toJpegB64(b) } });
    content.push({ type: "text", text: prompt + "\n\nConsegna il risultato chiamando lo strumento \"risposta\" con l'oggetto JSON richiesto (se è richiesto un elenco, usa {\"items\": [...]})." });
    // uso di uno strumento obbligatorio: l'API restituisce sempre un oggetto JSON valido
    const tool = { name: "risposta", description: "Restituisce il risultato strutturato richiesto.", input_schema: { type: "object", additionalProperties: true } };
    let res;
    try {
      res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
        headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: tier === "quick" ? "claude-haiku-5-5" : "claude-sonnet-5-5", max_tokens: maxTokens, tools: [tool], tool_choice: { type: "auto" }, messages: [{ role: "user", content }] }) });
    } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
    if (!res.ok) {
      let detail = ""; try { const ej = await res.json(); detail = (ej.error && ej.error.message) || ""; } catch (e) {}
      throw { code: res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : res.status === 413 ? "prompt_too_large" : res.status === 400 && /credit|balance|billing/i.test(detail) ? "no_credit" : res.status === 529 ? "overloaded" : "upstream_error", detail: res.status + " " + detail };
    }
    const j = await res.json();
    if (j.stop_reason === "max_tokens") throw { code: "too_long" };
    const tu = (j.content || []).find(x => x.type === "tool_use");
    let v = tu ? tu.input : undefined;
    if (v === undefined) { const text = (j.content || []).filter(x => x.type === "text").map(x => x.text).join(""); v = parseJsonLoose(text); if (v === undefined) throw { code: "invalid_json", detail: text.slice(0, 200) }; }
    return v;
  }
};
function parseJsonLoose(t) {
  t = String(t || "").trim();
  try { return JSON.parse(t); } catch (e) {}
  try { return JSON.parse(t.replace(/,\s*([}\]])/g, "$1")); } catch (e) {}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (f) { try { return JSON.parse(f[1]); } catch (e) {} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  return undefined;
}
function toJpegB64(blob) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1568 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .85).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej({ code: "image_rejected" }); };
    img.src = url;
  });
}
function aiErr(e) {
  const c = e && e.code;
  const m = { cancelled: null,
    no_ai: "Per usare l'AI fuori da Claude inserisci la tua chiave API in Piano → AI e dati.",
    bad_key: "La chiave API non è valida. Controllala in Piano → AI e dati.",
    network: "Nessuna connessione. Riprova.",
    not_granted: "Hai negato l'accesso a Claude per questa app.",
    rate_limited: "Troppe richieste o limite di utilizzo raggiunto. Riprova tra poco.",
    image_rejected: "Una delle immagini non è leggibile. Prova con un'altra foto.",
    images_unavailable: "Qui non posso leggere immagini: incolla il testo.",
    invalid_json: "Non sono riuscito a interpretare la risposta. Riprova.",
    no_credit: "Credito API esaurito: ricarica in console.anthropic.com → Billing.",
    overloaded: "Il servizio AI è sovraccarico in questo momento. Riprova tra qualche minuto.",
    too_long: "La scheda è molto lunga: carica allenamento e dieta separatamente, o poche pagine alla volta.",
    prompt_too_large: "Il documento è troppo lungo: caricane una parte alla volta.",
    session_expired: "Accedi di nuovo a Claude e riprova.",
    sampling_disabled: "Claude non è disponibile per questo account." }[c];
  return m === undefined ? "Qualcosa è andato storto. Riprova." : m;
}

/* ---------- macro ---------- */
const MK = ["kcal", "p", "c", "f"];
const MNAME = { kcal: "Calorie", p: "Proteine", c: "Carboidrati", f: "Grassi" };
const MUNIT = { kcal: " kcal", p: " g", c: " g", f: " g" };
const zeroT = () => ({ kcal: 0, p: 0, c: 0, f: 0 });
const hasMac = it => it && MK.some(k => num(it[k]) != null);
function sumItems(items) { const t = zeroT(); let known = 0; (items || []).forEach(it => { if (hasMac(it)) known++; MK.forEach(k => t[k] += num(it[k]) || 0); }); t.known = known; t.n = (items || []).length; return t; }
function addT(a, b) { MK.forEach(k => a[k] += b[k] || 0); return a; }
function macLine(t, lead = "") {
  return `<div class="mline">${lead}<span><b>${fmtI(t.kcal)}</b> kcal</span><span>P <b>${fmtI(t.p)}</b> g</span><span>C <b>${fmtI(t.c)}</b> g</span><span>G <b>${fmtI(t.f)}</b> g</span></div>`;
}
function cleanItem(x) {
  const o = { food: String(x.food || x.name || "").trim(), qty: x.qty ? String(x.qty) : "", alt: x.alt ? String(x.alt) : "" };
  MK.forEach(k => { const v = num(x[k]); if (v != null) o[k] = Math.round(v * 10) / 10; });
  return o;
}

/* ---------- accesso ai dati ---------- */
const plan = () => S.profile.plan;
const wDays = () => plan().workout.days || [];
const variants = () => plan().diet.variants || [];
function dayLog(date = S.date) {
  if (!S.days[date]) S.days[date] = { date, w: { dayId: null, ex: {}, done: false }, m: { eaten: {}, pick: {}, manual: {}, extra: [] } };
  const l = S.days[date]; l.w = l.w || { ex: {} }; l.w.ex = l.w.ex || {};
  l.m = l.m || {}; l.m.eaten = l.m.eaten || {}; l.m.pick = l.m.pick || {}; l.m.manual = l.m.manual || {}; l.m.extra = l.m.extra || [];
  return l;
}
const peekLog = (date = S.date) => S.days[date];
const slug = t => deacc(t).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "pasto";
function slots() { // un pannello per pasto (colazione, pranzo…); le giornate/opzioni della scheda diventano le sue varianti
  const map = new Map(); const many = variants().length > 1;
  variants().forEach((v, vi) => {
    const cnt = {};
    (v.meals || []).forEach((m, mi) => {
      let k = slug(m.name); cnt[k] = (cnt[k] || 0) + 1; if (cnt[k] > 1) k += "-" + cnt[k];
      if (!map.has(k)) map.set(k, { key: k, name: m.name, time: m.time || "", pos: mi + vi * 0.01, options: [] });
      const sl = map.get(k); if (!sl.time && m.time) sl.time = m.time;
      const sig = (m.items || []).map(x => deacc(x.food) + "|" + deacc(x.qty)).join(";");
      if (!sl.options.some(o => o.sig === sig)) sl.options.push({ id: m.id, meal: m, sig, vname: many ? v.name : "", items: m.items || [] });
    });
  });
  const list = [...map.values()];
  if (list.every(x => x.time)) list.sort((a, b) => a.time.localeCompare(b.time)); else list.sort((a, b) => a.pos - b.pos);
  list.forEach(sl => { sl.alts = (plan().diet.alts || {})[sl.key] || []; });
  return list;
}
const findSlot = k => slots().find(x => x.key === k);
function mealLog() { const l = peekLog(); const m = (l && l.m) || {}; return { eaten: m.eaten || {}, pick: m.pick || {}, manual: m.manual || {}, extra: m.extra || [] }; }
function optLabel(sl, id) {
  if (id === "manual") return "Scritto da me";
  const i = sl.options.findIndex(o => o.id === id); if (i >= 0) return sl.options.length > 1 ? "Variante " + (i + 1) : "Scheda";
  const a = sl.alts.find(x => x.id === id); return a ? (a.name || "Variante AI") : "Scheda";
}
function slotPick(ml, sl) {
  const p = ml.pick[sl.key];
  if (p === "manual") return { kind: "manual", id: "manual", items: ml.manual[sl.key] || [] };
  const a = p && sl.alts.find(x => x.id === p); if (a) return { kind: "alt", id: a.id, alt: a, items: a.items || [] };
  const o = (p && sl.options.find(x => x.id === p)) || sl.options[0];
  return { kind: "opt", id: o ? o.id : null, opt: o, items: o ? o.items : [] };
}
function dayTotals() {
  const ml = mealLog(); const t = zeroT();
  slots().forEach(sl => { if (ml.eaten[sl.key]) addT(t, sumItems(slotPick(ml, sl).items)); });
  return addT(t, sumItems(ml.extra));
}
function targetsFor() {
  const t = plan().diet.targets || {};
  let T = { kcal: num(t.kcal), p: num(t.protein), c: num(t.carbs), f: num(t.fat) };
  if (MK.every(k => !T[k])) {
    const s = zeroT(); let known = 0; slots().forEach(sl => { if (!sl.options[0]) return; const x = sumItems(sl.options[0].items); known += x.known; addT(s, x); });
    if (known && s.kcal) { T = s; T.fromPlan = true; }
  }
  return T;
}

const deacc = s => norm(s).normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/['’]/g, " ");

function parseQuery(q) {
  let s = " " + q + " "; let qty = null, unit = null;
  const m = s.match(/\s(\d+(?:[.,]\d+)?)\s*(g|gr|grammi|ml|pz|x)?\s/i);
  if (m) { qty = num(m[1]); unit = m[2] && /pz|x/i.test(m[2]) ? "pz" : (m[2] ? "g" : null); s = s.replace(m[0], " "); }
  return { terms: deacc(s).split(/\s+/).filter(t => t.length > 1 && !["di", "con", "al", "alla", "e"].includes(t)), qty, unit };
}
function recentFoods() {
  const seen = {}; const out = [];
  for (const d of sortedDates().reverse()) {
    const m = S.days[d].m; if (!m) continue;
    const all = [...Object.values(m.manual || {}).flat(), ...(m.extra || [])];
    for (const it of all) { if (!it || it.src === "db" || it.src === "mine" || it.src === "label") continue; const k = deacc(it.food); if (seen[k] || !hasMac(it)) continue; seen[k] = 1; out.push(it); if (out.length >= 40) return out; }
  }
  return out;
}
function searchFoods(q) {
  const { terms, qty, unit } = parseQuery(q); if (!terms.length) return [];
  const stem = t => t.length > 3 ? t.replace(/[aeiou]$/, "") : t; // uova/uovo, mele/mela
  const score = name => { const words = deacc(name).split(/[\s(),%-]+/).filter(Boolean); let sc = 0; for (const t of terms) { const st = stem(t); if (words.some(w => w === t || stem(w) === st)) sc += 3; else if (words.some(w => w.startsWith(st))) sc += 2; else if (deacc(name).includes(st)) sc += 1; else return 0; } if (deacc(name).startsWith(stem(terms[0]))) sc += 1; return sc; };
  const cands = [];
  (S.profile.foods || []).forEach(f => { const sc = score(f.name); if (sc) cands.push({ ...f, src: "mine", sc: sc + 3 }); });
  recentFoods().forEach(it => { const sc = score(it.food); if (!sc) return; const g = String(it.qty || "").match(/^\s*(\d+(?:[.,]\d+)?)\s*(g|ml)\b/i); const c = { name: it.food, src: "recent", sc: sc + 1 }; if (g && num(g[1])) { const gr = num(g[1]); c.per100 = {}; MK.forEach(k => c.per100[k] = (num(it[k]) || 0) / gr * 100); c.defG = gr; } else c.fixed = it; cands.push(c); });
  FOODS.forEach(f => { const sc = score(f.name); if (sc) cands.push({ ...f, sc }); });
  cands.sort((a, b) => b.sc - a.sc || a.name.length - b.name.length);
  const seen = {}; const out = [];
  for (const c of cands) { const k = deacc(c.name); if (seen[k]) continue; seen[k] = 1; c.qHint = qty; c.uHint = unit; out.push(c); if (out.length >= 7) break; }
  return out;
}

}

function lineChart(points, unit) {
  if (points.length < 2) return `<p class="small muted" style="margin:0">Servono almeno due misure per vedere il grafico.</p>`;
  const W = 340, H = 150, L = 36, R = 12, Tp = 12, B = 24;
  const ys = points.map(p => p.y); let mn = Math.min(...ys), mx = Math.max(...ys); if (mx - mn < 1) { mn -= .5; mx += .5; }
  const padY = (mx - mn) * .12; mn -= padY; mx += padY;
  const x = i => L + i * (W - L - R) / (points.length - 1), y = v => Tp + (mx - v) * (H - Tp - B) / (mx - mn);
  const ticks = [mn + (mx - mn) * .15, (mn + mx) / 2, mx - (mx - mn) * .15];
  const path = points.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.y).toFixed(1)).join(" ");
  const area = path + ` L${x(points.length - 1).toFixed(1)} ${H - B} L${L} ${H - B} Z`;
  const lastP = points[points.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento ${unit}">
    ${ticks.map(t => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${fmtN(t)}</text>`).join("")}
    <path d="${area}" fill="var(--accent)" fill-opacity=".1"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(points.length - 1)}" cy="${y(lastP.y)}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H - 6}">${esc(points[0].l)}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(lastP.l)}</text>
  </svg>`;
}

function vProgressi() {

  const sess = sessionDates();

  const maxW = Math.max(3, ...weeks.map(w => w.n));
  const exMap = {};
  sess.forEach(d => { const ex = S.days[d].w.ex; for (const k in ex) { const top = Math.max(0, ...(ex[k].s || []).filter(s => s && s.done).map(s => num(s.kg) || 0)); if (top > 0) { const key = norm(ex[k].name); (exMap[key] = exMap[key] || { name: ex[k].name, pts: [] }).pts.push({ d, kg: top }); } } });
  const exKeys = Object.keys(exMap).sort((a, b) => exMap[b].pts.length - exMap[a].pts.length);
  if (!S.progEx || !exMap[S.progEx]) S.progEx = exKeys[0] || null;

    </div>
    <div class="card stack">
      <div class="row between"><span class="eyebrow">Allenamenti a settimana</span><span class="small muted">${sess.length} in totale</span></div>
      <div class="weeks">${weeks.map((w, i) => `<div title="${w.n} allenamenti"><span class="num" style="font-size:14px;color:var(--ink)">${w.n || ""}</span><i style="height:${w.n / maxW * 64}px;${i === 7 ? "" : "opacity:.55"}"></i><span>${w.s.getDate()}/${w.s.getMonth() + 1}</span></div>`).join("")}</div>
    </div>

      <span class="small muted">Record: <b class="num" style="font-size:17px;color:var(--ink)">${fmtN(Math.max(...ex.pts.map(p => p.kg)))} kg</b></span>`

}

const PROMPT = `Trasforma questo materiale (scheda di allenamento e/o piano alimentare, di solito in italiano, scritto da un personal trainer o un nutrizionista) in dati strutturati.
Non inventare esercizi o alimenti: riporta solo quello che c'è. Mantieni i nomi in italiano come scritti. Se un valore manca usa null o "".
Rispondi solo con un oggetto JSON con questa forma:
{"workout": {"days": [{"name": "Giorno A - Petto e tricipiti", "exercises": [{"name": "Panca piana", "sets": 4, "reps": "8-10", "rest": 90, "load": "", "notes": ""}]}]} oppure null se non c'è una scheda,
 "diet": {"targets": {"kcal": 2400, "protein": 160, "carbs": 280, "fat": 70}, "notes": "", "variants": [{"name": "Giorno di allenamento", "meals": [{"name": "Colazione", "time": "07:30", "items": [{"food": "Fiocchi d'avena", "qty": "80 g", "alt": "Pane integrale 100 g", "kcal": 300, "p": 11, "c": 54, "f": 6}], "notes": ""}]}]} oppure null se non c'è una dieta}
Regole:
- sets è un numero intero; reps è testo (es. "10", "8-10", "12-10-8-6", "30 sec", "max").
- rest è il recupero in secondi come numero (2' = 120, 1'30" = 90); null se non indicato.
- load è il carico o l'intensità se indicati (es. "70%", "RPE 8", "20 kg"), altrimenti "".
- Superserie, circuiti, tempo sotto tensione, tecnica o varianti vanno in notes dell'esercizio.
- Se la dieta ha giornate diverse (allenamento/riposo, giorni della settimana) o più opzioni numerate per i pasti (Variante/Opzione 1, 2, 3), crea una variante per ciascuna, con lo stesso elenco di pasti e gli stessi nomi dei pasti (Colazione, Spuntino, Pranzo…); i pasti che non cambiano vanno ripetuti uguali. Altrimenti una sola variante chiamata "Giornata tipo".
- Alternative tra alimenti ("oppure", "in alternativa") vanno in alt.
- Per ogni alimento stima kcal, p (proteine g), c (carboidrati g), f (grassi g) per la quantità indicata (non per 100 g), con valori medi da tabelle nutrizionali. Per "a volontà" stima una porzione tipica (verdure 200 g).
- targets: usa i valori scritti nella dieta se presenti, altrimenti null.
- Indicazioni generali della dieta (acqua, integratori, sgarri, condimenti) vanno in diet.notes.`;

function normalizePlan(r) {
  const out = {};
  if (r && r.workout && Array.isArray(r.workout.days) && r.workout.days.length) {
    out.workout = { days: r.workout.days.map((d, i) => ({ id: uid(), name: String(d.name || "Giorno " + String.fromCharCode(65 + i)), exercises: (d.exercises || []).filter(e => e && e.name).map(e => ({ id: uid(), name: String(e.name), sets: parseInt(e.sets) || 3, reps: e.reps == null ? "" : String(e.reps), rest: parseInt(e.rest) || "", load: e.load ? String(e.load) : "", notes: e.notes ? String(e.notes) : "" })) })) };
  }
  if (r && r.diet && Array.isArray(r.diet.variants) && r.diet.variants.length) {
    const t = r.diet.targets || {};
    out.diet = { targets: { kcal: num(t.kcal) || "", protein: num(t.protein) || "", carbs: num(t.carbs) || "", fat: num(t.fat) || "" }, notes: r.diet.notes ? String(r.diet.notes) : "",
      variants: r.diet.variants.map((v, i) => ({ id: uid(), name: String(v.name || "Giornata " + (i + 1)), meals: (v.meals || []).filter(m => m).map(m => ({ id: uid(), name: String(m.name || "Pasto"), time: m.time ? String(m.time) : "", notes: m.notes ? String(m.notes) : "", alts: [], items: (m.items || []).filter(x => x && x.food).map(cleanItem) })) })) };
  }
  return out;
}

function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script")); document.head.appendChild(s); }); }
async function pdfToInputs(file, maxImgs) {
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if (!window.pdfjsLib) { await loadScript(base + "pdf.min.js"); await loadScript(base + "pdf.worker.min.js"); }
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false }).promise;
  let text = ""; const imgs = [];
  for (let i = 1; i <= Math.min(pdf.numPages, 20); i++) {
    const page = await pdf.getPage(i);
    const tc = await page.getTextContent(); text += "\n--- Pagina " + i + " ---\n" + tc.items.map(x => x.str + (x.hasEOL ? "\n" : " ")).join("");
    if (imgs.length < maxImgs) {
      const vp0 = page.getViewport({ scale: 1 }); const scale = Math.min(2, 1400 / vp0.width); const vp = page.getViewport({ scale });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      imgs.push(await new Promise(r => c.toBlob(r, "image/jpeg", .85)));
    }
  }
  return { text: text.slice(0, 60000), imgs };
}

async function runImport({ text = "", images = [] }) {
  if (!AI.ready()) { setImport(IN_CLAUDE ? "Per leggere foto e testi serve il permesso di usare Claude. Puoi comunque inserire il piano a mano qui sotto." : aiErr({ code: "no_ai" }), true); return; }
  S.importBusy = true; S.pending = null; setImport("Sto leggendo la scheda… di solito serve meno di un minuto.");
  S.ctl = new AbortController();
  try {
    const src = text ? "\n\nMATERIALE:\n" + text : "\n\nIl materiale è nelle immagini allegate (in ordine di pagina).";
    // allenamento e dieta in due richieste parallele: risposte più corte, niente tagli sulle schede lunghe
    const parts = await Promise.allSettled([
      AI.json(PROMPT + "\n\nIn questa risposta estrai SOLO la scheda di allenamento e metti \"diet\": null." + src, { images, signal: S.ctl.signal, maxTokens: 16000 }),
      AI.json(PROMPT + "\n\nIn questa risposta estrai SOLO il piano alimentare e metti \"workout\": null." + src, { images, signal: S.ctl.signal, maxTokens: 32000 })
    ]);
    const ok = parts.filter(x => x.status === "fulfilled").map(x => x.value || {});
    if (!ok.length) throw parts[1].reason || parts[0].reason;
    const r = { workout: (ok.find(x => x.workout) || {}).workout || null, diet: (ok.find(x => x.diet) || {}).diet || null };
    const failed = parts.map((x, i) => x.status === "rejected" && !(x.reason && x.reason.code === "cancelled") ? (i ? "la dieta" : "l'allenamento") : null).filter(Boolean);
    if (failed.length) toast("Non sono riuscito a leggere " + failed.join(" e ") + ": riprova solo con quella parte.", 6000);
    const p = normalizePlan(r);
    if (!p.workout && !p.diet) { S.importBusy = false; setImport("Non ho trovato né esercizi né pasti. Prova con una foto più nitida e dritta, o incolla il testo.", true); return; }
    S.pending = p; S.importBusy = false; setImport(null);
  } catch (e) {
    S.importBusy = false; let m = aiErr(e); if (m && e && e.detail) m += " (dettagli: " + String(e.detail).slice(0, 160) + ")"; setImport(m, m !== null);
  }
}
function setImport(msg, err = false) { S.importMsg = msg; S.importErr = err; if (S.tab === "piano") render(); }

async function handleFiles(files) {
  files = Array.from(files || []); if (!files.length) return;
  const maxImgs = AI.maxImages();
  const imgs = []; let text = "";
  try {
    S.importBusy = true; setImport("Preparo i file…");
    for (const f of files) {
      if (f.type === "application/pdf" || /\.pdf$/i.test(f.name)) {
        const r = await pdfToInputs(f, Math.max(0, maxImgs - imgs.length)); imgs.push(...r.imgs); text += r.text;
      } else if (f.type.startsWith("image/") || /\.(jpe?g|png|heic|webp)$/i.test(f.name)) { if (imgs.length < maxImgs) imgs.push(f); }
    }
  } catch (e) {
    S.importBusy = false; setImport("Non riesco ad aprire questo PDF. Fai uno screenshot delle pagine e carica le immagini.", true); return;
  }
  S.importBusy = false;
  if (!imgs.length && !text.trim()) { setImport("Formato non supportato: usa foto (JPG, PNG) o PDF.", true); return; }
  if (imgs.length && !AI.canImages()) {
    if (text.trim().length > 80) return runImport({ text });
    setImport(AI.ready() ? "Qui non posso leggere immagini: incolla il testo della scheda." : aiErr({ code: "no_ai" }), true); return;
  }
  runImport({ text: text.trim().length > 80 ? text : "", images: imgs });
}

Dividi in singoli alimenti. Se la quantità non è indicata, assumi una porzione tipica italiana e scrivila in qty (es. "porzione ~80 g", "1 lattina 330 ml"). I valori sono per la quantità indicata, non per 100 g, con valori medi da tabelle nutrizionali (CREA, USDA).
Rispondi solo con JSON: {"items":[{"food":"Pasta di semola","qty":"100 g","kcal":355,"p":12,"c":72,"f":1.5}]}`, { tier: "quick" });
  const arr = Array.isArray(r) ? r : (r && Array.isArray(r.items) ? r.items : []);
  return arr.filter(x => x && (x.food || x.name)).map(cleanItem);

async function fillMacros(v) {
  const refs = []; const lines = [];
  (v.meals || []).forEach(m => (m.items || []).forEach(it => { if (!hasMac(it)) { const id = "a" + refs.length; refs.push(it); lines.push(`${id}: ${it.qty || "porzione tipica"} ${it.food}`); } }));
  if (!refs.length) return 0;
  const r = await AI.json(`Stima i valori nutrizionali di questi alimenti di un piano alimentare italiano, per la quantità indicata (non per 100 g). Per "a volontà" o quantità mancanti stima una porzione tipica (verdure 200 g, frutta 150 g).
${lines.join("\n")}
Rispondi solo con un oggetto JSON: {"a0":[kcal, proteine_g, carboidrati_g, grassi_g], ...} con una voce per ogni id.`, { tier: "quick" });
  let n = 0;
  refs.forEach((it, i) => { const a = r && r["a" + i]; if (Array.isArray(a) && a.length >= 4) { MK.forEach((k, j) => { const x = num(a[j]); if (x != null) it[k] = Math.round(x * 10) / 10; }); n++; } });
  return n;
}

async function exportBackup() {
  const data = JSON.stringify({ app: "carico", v: 2, exported: new Date().toISOString(), profile: S.profile, days: S.days });
  const filename = "carico-backup-" + today() + ".json";
  if (IN_CLAUDE) {
    try { const dl = await claude.use("downloads"); if (dl) { await dl.save({ filename, data }); S.dataMsg = "Backup salvato."; render(); return; } }
    catch (e) { if (e && e.code === "declined") return; }
    try { await navigator.clipboard.writeText(data); S.dataMsg = "Backup copiato negli appunti: incollalo in una nota per conservarlo."; } catch (e) { S.dataMsg = "Non riesco a esportare da qui."; }
    render(); return;
  }
  const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  S.dataMsg = "Backup scaricato in File."; render();
}

}

function setField(el) {

  const day = currentDay(); const ex = (day.exercises || []).find(e => e.id === exId); if (!ex) return;
  if (l.w.dayId !== day.id) { l.w = { dayId: day.id, dayName: day.name, ex: {}, done: false }; }
  const e = l.w.ex[exId] = l.w.ex[exId] || { name: ex.name, s: [] };

function md(t) {
  const lines = esc(t).split("\n"); let out = "", ul = false;
  const inl = x => x.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<i>$2</i>");
  for (const raw of lines) {
    const l = raw.trim();
    const li = l.match(/^([-•*]|\d+[.)])\s+(.*)$/);
    if (li) { if (!ul) { out += "<ul>"; ul = true; } out += "<li>" + inl(li[2]) + "</li>"; continue; }
    if (ul) { out += "</ul>"; ul = false; }
    if (!l) continue;
    const h = l.match(/^#{1,4}\s+(.*)$/);
    out += "<p>" + (h ? "<b>" + inl(h[1]) + "</b>" : inl(l)) + "</p>";
  }
  return out + (ul ? "</ul>" : "");
}
AI.chat = async function (turns, { onText, signal } = {}) {
  const ctx = COACH_RULES + "\n\nDATI DELL'UTENTE:\n" + coachContext();
  if (this.sample) {
    const input = [{ role: "user", content: ctx }, ...turns];
    const r = await this.sample(input, { cache: false, signal, onText: ({ text }) => onText && onText(text) });
    return r.text;
  }
  const key = this.key(); if (!key) throw { code: "no_ai" };
  const msgs = []; turns.forEach(m => { const last = msgs[msgs.length - 1]; if (last && last.role === m.role) last.content += "\n\n" + m.content; else msgs.push({ role: m.role, content: m.content }); });
  while (msgs.length && msgs[0].role !== "user") msgs.shift();
  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", signal,
      headers: { "content-type": "application/json", "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: "claude-sonnet-5-5", max_tokens: 2000, stream: true, system: ctx, messages: msgs }) });
  } catch (e) { throw { code: e && e.name === "AbortError" ? "cancelled" : "network" }; }
  if (!res.ok) { let detail = ""; try { const ej = await res.json(); detail = (ej.error && ej.error.message) || ""; } catch (e) {} throw { code: res.status === 401 || res.status === 403 ? "bad_key" : res.status === 429 ? "rate_limited" : /credit|balance|billing/i.test(detail) ? "no_credit" : res.status === 529 ? "overloaded" : "upstream_error", detail: res.status + " " + detail }; }
  let text = "";
  if (!res.body || !res.body.getReader) { const j = await res.json(); text = (j.content || []).filter(x => x.type === "text").map(x => x.text).join(""); onText && onText(text); return text; }
  const rd = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
  try {
    for (;;) {
      const { done, value } = await rd.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
        if (!line.startsWith("data:")) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch (e) { continue; }

      }
    }
  } catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled", text }; throw e.code ? e : { code: "network", text }; }
  return text;
};

async function coachSend(text) {

(function initFab() {
  const fab = $("#fab"); const SZ = 58, M = 10;
  let pos = (() => { try { return JSON.parse(lsGet("carico.fab") || "null"); } catch (e) { return null; } })();
  const bounds = () => ({ w: window.innerWidth, h: window.innerHeight });
  const clamp = p => { const { w, h } = bounds(); return { x: Math.min(Math.max(p.x, M), w - SZ - M), y: Math.min(Math.max(p.y, M + 40), h - SZ - 80) }; };

  fab.addEventListener("pointerdown", e => { st = { x: e.clientX, y: e.clientY, px: pos.x, py: pos.y, moved: false }; try { fab.setPointerCapture(e.pointerId); } catch (er) {} });

  const end = () => { if (!st) return; const moved = st.moved; st = null; fab.classList.remove("drag");
    if (moved) { justDragged = Date.now(); const { w } = bounds(); pos.x = pos.x + SZ / 2 < w / 2 ? M : w - SZ - M; place(); lsSet("carico.fab", JSON.stringify(pos)); } };
  fab.addEventListener("pointerup", end); fab.addEventListener("pointercancel", end);
  // il tocco apre sempre il coach (anche se il sistema annulla il gesto mentre la pagina scorre)
  fab.addEventListener("click", e => { e.preventDefault(); e.stopPropagation(); if (Date.now() - justDragged < 400) return; openCoach(); });
  fab.addEventListener("touchmove", e => { e.preventDefault(); }, { passive: false });
  fab.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openCoach(); } });
  window.addEventListener("resize", place);
  place(); fab.hidden = false;
})();
